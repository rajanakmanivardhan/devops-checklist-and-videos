 const p=dc/V.length;$("#ring").style.strokeDashoffset=326.7*(1-p);$("#pct").textContent=Math.round(p*100)+"%";$("#pctsub").textContent=dc+" of "+V.length;
 $("#sDone").textContent=dc;$("#sLeft").textContent=V.length-dc;$("#hDone").textContent=(ds/3600).toFixed(1);$("#hLeft").textContent=((ts-ds)/3600).toFixed(1);

function applyFilter(){
 let any=false;
 document.querySelectorAll(".sec").forEach(s=>{let vis=0;
  s.querySelectorAll(".row").forEach(r=>{const d=r.classList.contains("done");
   const ok=(filt==="all"||(filt==="done")===d)&&(!query||r.dataset.t.includes(query));r.hidden=!ok;r.style.display=ok?"":"none";if(ok)vis++;});
  s.style.display=vis?"":"none";if(vis)any=true;});
 $("#empty").hidden=any;
}
